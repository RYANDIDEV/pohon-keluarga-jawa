<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pohon Keluarga Pro - Silsilah Jawa Sesepuh</title>
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Pohon Keluarga Pro</h2>
            <p>Silsilah & Chat AI 🤖</p>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
        <div class="sidebar-footer">
            <button class="btn-success" onclick="openModal('root', null)">+ Leluhur Baru</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h3 id="activeTreeTitle">Bagan Kosong</h3>
            <div class="btn-group">
                <button class="btn-ai" onclick="openAIModal()">🤖 Chat Asisten</button>
                <button class="btn-primary" onclick="resetPositions()" title="Kembalikan semua kotak ke susunan otomatis">🧹 Rapihkan Posisi</button>
                <button class="btn-warning" onclick="undoAction()" title="Shortcut: Ctrl + Z">↩️ Undo</button>
                <button class="btn-danger-main" onclick="clearTree()">Hapus Semua</button>
            </div>
        </header>
        
        <div class="tree-viewport" id="treeViewport">
            <div class="zoom-controls">
                <button onclick="zoomCanvas(0.1)" title="Zoom In">➕</button>
                <button onclick="zoomCanvas(-0.1)" title="Zoom Out">➖</button>
                <button onclick="resetZoom()" title="Reset Kamera">⌂ Reset</button>
            </div>
            <div class="tree-canvas" id="treeCanvas">
                <svg class="tree-svg" id="treeSvg"></svg>
                <div id="familyTree"></div>
            </div>
        </div>
    </main>

    <!-- MODAL TAMBAH ANGGOTA -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Tambah Anggota</h3>
            
            <div class="form-group-modal">
                <label for="modalName">Nama Lengkap:</label>
                <input type="text" id="modalName" placeholder="Ketik nama di sini...">
            </div>

            <!-- FITUR: EDIT URUTAN ANAK -->
            <div class="form-group-modal" id="childOrderGroup" style="display: none;">
                <label>Urutan Lahir (Anak Ke-):</label>
                <input type="number" id="modalChildOrder" min="1" value="1">
                <div style="font-size: 11.5px; color: #64748b; margin-top: 4px;">*Ubah angka ini untuk menggeser posisi (1 = Paling Kiri/Tua). AI menggunakan ini untuk sebutan Pakdhe/Paklik.</div>
            </div>

            <div class="form-group-modal" id="spouseOrderGroup" style="display: none;">
                <label>Status Pasangan (Hukum Jawa):</label>
                <select id="modalSpouseOrder">
                    <option value="1">Pasangan Asli / Tunggal (Ke-1)</option>
                    <option value="2">Pasangan Kedua (Ke-2)</option>
                    <option value="3">Pasangan Ketiga (Ke-3)</option>
                    <option value="4">Pasangan Keempat (Ke-4)</option>
                </select>
            </div>
            
            <div class="form-group-modal" id="partnerSelectionGroup" style="display: none;">
                <label>Anak dari Pasangan (Ibu/Ayah):</label>
                <select id="modalPartnerId">
                    <option value="">-- Bebas / Tunggal --</option>
                </select>
            </div>

            <div class="form-group-modal">
                <label>Jenis Kelamin / Peran:</label>
                <div class="gender-options">
                    <label class="gender-radio"><input type="radio" name="modalGender" value="L" id="radioL"> Laki-laki</label>
                    <label class="gender-radio"><input type="radio" name="modalGender" value="P" id="radioP"> Perempuan</label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-primary" onclick="submitModal()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL AI CHAT INTERAKTIF -->
    <div id="aiModal" class="modal-overlay">
        <div class="ai-modal-box">
            <div class="ai-header">
                <div>🤖 Asisten Silsilah Keluarga</div>
                <button class="ai-close-btn" onclick="closeAIModal()">✕</button>
            </div>
            <div class="ai-chat-area" id="aiChatArea"></div>
            <div class="ai-input-area">
                <input type="text" id="aiInput" placeholder="Ketik nama / tanya sesuatu... (contoh: Siapa keponakan Ryandi?)">
                <button onclick="sendUserMessage()">Kirim</button>
            </div>
        </div>
    </div>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
